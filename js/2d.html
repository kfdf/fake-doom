<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  box-sizing: border-box;
  margin: 0;
}
body {
  background-color: #666 !important;
  overflow: hidden;
}
canvas {
  object-fit: contain;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
}
.panel {
  top: 0;
  left: 0;
  position: fixed; 
  display: grid;
  justify-items: start;
  > select {
    font-size: inherit;
    padding: 0.1rem;
  }
  > label {
    > span {
      border: 1px solid black;
      padding: 0.2rem 0.3rem;
      font-family: sans-serif;
      color: black;
      background-color: white;
    }
    > input {
      display: none;
      ~ .on {
        display: none;
        input:checked ~ & {
          display: block;
        }
      }
      ~ .off {
        display: block;
        input:checked ~ & {
          display: none;
        }
      }
    }
  }
}
#controls {
  touch-action: none;
  display: none;
  label:has(:checked) + & {
    display: grid;
  }
  grid-template-columns: repeat(3, 2.5rem);
  > button {
    border: 1px solid black;
    text-align: center;
    font-size: 2rem;
    line-height: 2.5rem;
    background-color: white;
    color: black;
    font-family: sans-serif;
    cursor: pointer;
    &[data-key2] {
      text-decoration: underline;
    }
  }
}
</style>
<script type="module" src="./2d.js"></script>
<canvas></canvas>
<div class="panel">
  <select id="map-select" disabled>
    <option value="E1M1" selected>E1M1 Hangar</option>
    <option value="E1M2">E1M2 Nuclear Plant</option>
    <option value="E1M3">E1M3 Toxin Refinery</option>
    <option value="E1M4">E1M4 Command Control</option>
    <option value="E1M5">E1M5 Phobos Lab</option>
    <option value="E1M6">E1M6 Central Processing</option>
    <option value="E1M7">E1M7 Computer Station</option>
    <option value="E1M8">E1M8 Phobos Anomaly</option>
    <option value="E1M9">E1M9 Military Base</option>
  </select>
  <label>
    <input id="culling-checkbox" type="checkbox">
    <span class="on">Clipping mask ON</span>
    <span class="off">Clipping mask OFF</span>
  </label>
  <label>
    <input id="segments-checkbox" type="checkbox">
    <span class="on">Segments</span>
    <span class="off">Bounding boxes</span>
  </label>
  <label>
    <input type="checkbox">
    <span class="on">Hide controls</span>
    <span class="off">Show controls</span>
  </label>
  <div id="controls">
    <button data-key="ArrowLeft">L</button>
    <button data-key="ArrowUp">F</button>
    <button data-key="ArrowRight">R</button>
    <button data-key="ArrowLeft" data-key2="AltLeft">L</button>
    <button data-key="ArrowDown">B</button>
    <button data-key="ArrowRight" data-key2="AltLeft">R</button>
    <button data-key="Space" style="grid-column: 1 / -1">Space</button>
  </div>
</div>
